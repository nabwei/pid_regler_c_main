name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: mkdir -p build
      - run: gcc -O2 -Wall -Wextra -Werror -std=c11 pid_min_project/pid_min.c -o build/pid_min -lm
      - run: gcc -O2 -Wall -Wextra -Werror -std=c11 tests/check_controller.c -o build/check_controller -lm
      - run: ./build/check_controller
      - run: ./build/pid_min
      - run: python tests/check_step.py simulation.csv
